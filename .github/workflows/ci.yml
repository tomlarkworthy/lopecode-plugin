name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - uses: actions/setup-node@v4
        with:
          node-version: '20'   # the floor declared in package.json engines

      # playwright is a devDependency (qa_* tools and the e2e job load it lazily); its
      # postinstall would pull ~150MB of browsers this job never launches.
      - run: npm install --no-audit --no-fund
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'

      - run: bun run build.ts

      # dist/ is committed and is what users actually run, so a stale commit is a real bug.
      - name: dist/ is up to date with src/
        run: |
          if ! git diff --quiet -- dist/; then
            echo "dist/ differs from a fresh build of src/ — run 'bun run build.ts' and commit"
            # The actual differing lines, not just a stat: when the mismatch is a toolchain
            # difference rather than a stale commit, the stat alone says nothing.
            git diff --unified=0 -- dist/ | head -60
            echo "--- builder versions ---"
            bun --version
            node -p "require('./node_modules/esbuild/package.json').version"
            exit 1
          fi

      - run: bun test ./tests/lopecode-channel.test.ts

      # Both entry points must work: dist/ is what ships, src/ is what we develop against.
      - name: Verify Node bundle
        run: node verify-node-build.mjs
      - name: Verify Bun source path
        run: node verify-node-build.mjs bun src/lopecode-channel.ts

      # The same check the community-marketplace review pipeline runs on submission.
      - name: Validate the plugin manifest
        run: |
          npm install -g @anthropic-ai/claude-code
          claude plugin validate .

      # Proves `claude mcp add lopecode -- npx -y @lopecode/channel`: the packed tarball
      # must install with no dependencies at all — a plain install, no --omit flags, is
      # what a user's npx actually runs.
      - name: Verify packed tarball (npx path)
        run: |
          set -euo pipefail
          TGZ=$(npm pack --silent --pack-destination "$RUNNER_TEMP")
          mkdir -p "$RUNNER_TEMP/npxtest" && cd "$RUNNER_TEMP/npxtest"
          npm init -y >/dev/null
          npm install --no-audit --no-fund "$RUNNER_TEMP/$TGZ"
          DEPS=$(ls node_modules | grep -v '^\.' | grep -v '^@lopecode$' || true)
          if [ -n "$DEPS" ]; then echo "unexpected runtime deps: $DEPS"; exit 1; fi
          node "$GITHUB_WORKSPACE/verify-node-build.mjs" \
            "$RUNNER_TEMP/npxtest/node_modules/.bin/lopecode-channel"

  # Pairs a notebook served from github.io to a local channel. Depends on the published
  # corpus and the network, so it is kept off the PR path where it would gate unrelated work.
  e2e:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm install --no-audit --no-fund
      - run: npx playwright install --with-deps chromium
      - run: bun run build.ts

      # Chrome 151 gates loopback WebSockets on the Local Network Access permission. Headless
      # denies the prompt, so the gate is turned off for the deterministic run; the headed run
      # under xvfb records what a real user hits and is informational only.
      - name: Probe — LNA gate on, permission granted (informational)
        continue-on-error: true
        run: node verify-https-pairing.mjs

      - name: Verify https pairing
        env:
          LOPE_E2E_DISABLE_LNA: '1'
        run: node verify-https-pairing.mjs
